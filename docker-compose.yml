services:
  postgres:
    # Official Postgres 16. If Docker Hub is geo-blocked, pull a mirror and retag it as postgres:16.
    image: postgres:16
    container_name: family-care-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: family_care
      POSTGRES_PASSWORD: family_care
      POSTGRES_DB: family_care
    volumes:
      - family_care_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_care -d family_care"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  family_care_postgres:
